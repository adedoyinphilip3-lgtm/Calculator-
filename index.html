<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
    }

    .calculator {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    #display {
      width: 100%;
      height: 70px;
      font-size: 2rem;
      text-align: right;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #2b2b2b;
      color: white;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .operator {
      background: #ffb703;
      color: #111;
      font-weight: bold;
    }

    .number {
      background: #eaeaea;
      color: #111;
    }

    .equal {
      background: #28a745;
      color: white;
      grid-column: span 2;
    }

    .clear {
      background: #dc3545;
      color: white;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" readonly />

    <div class="buttons">
      <button class="clear" data-value="C">C</button>
      <button class="operator" data-value="/">/</button>
      <button class="operator" data-value="*">*</button>
      <button class="operator" data-value="-">-</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="+">+</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-value="DEL">DEL</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="equal" data-value="=">=</button>

      <button class="number" data-value="0" style="grid-column: span 2;">0</button>
      <button class="number" data-value=".">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let expression = "";

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        const value = button.dataset.value;

        if (value === "C") {
          expression = "";
          display.value = "";
          return;
        }

        if (value === "DEL") {
          expression = expression.slice(0, -1);
          display.value = expression;
          return;
        }

        if (value === "=") {
          try {
            const result = Function(`"use strict"; return (${expression})`)();
            if (!Number.isFinite(result)) {
              throw new Error("Invalid calculation");
            }
            expression = result.toString();
            display.value = expression;
          } catch {
            display.value = "Error";
            expression = "";
          }
          return;
        }

        if (/[0-9.]/.test(value)) {
          if (value === "." && expression.split(/[+\-*/]/).pop().includes(".")) return;
          expression += value;
          display.value = expression;
          return;
        }

        if (/[+\-*/]/.test(value)) {
          if (!expression || /[+\-*/.]$/.test(expression)) return;
          expression += value;
          display.value = expression;
        }
      });
    });
  </script>
</body>
  </html>
